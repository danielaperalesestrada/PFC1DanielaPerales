skip_train: true
skip_test: true
skip_mesh: false
skip_cull: false
skip_metrics: false
render_path: false
case_name: scan24
root_dir: /media/daniela/Archivos1/PFC1DanielaPerales/datasets/dtu/DTU/scan24
pipeline:
  convert_SHs_python: false
  compute_view2gaussian_python: false
  debug: false
  depth_ratio: 0.0
  use_multi_normal: false
